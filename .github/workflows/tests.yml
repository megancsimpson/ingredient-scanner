# Runs ESLint and the tests for the server and the app on GitHub every time
# code is pushed (to any branch) or a pull request is opened, and shows a ✓
# or ✗ next to the commit. The tests use fakes for MongoDB, Google Vision
# and Gmail, so no secrets are needed here.
name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The same Node version as Render (engines in backend/package.json)
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # npm ci installs exactly what's in package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  frontend:
    name: App tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # The whole repo is checked out, since one app test reads the server's
      # category list (backend/models/SavedProduct.js)
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
